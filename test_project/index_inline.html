<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Utility Functions - Mocha Tests</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mocha@10/mocha.css">
</head>
<body>
  <h1>Utility Functions Test Suite</h1>
  <div id="mocha"></div>
  <div id="output">
    <output name="results" for="program">
    </output>
  </div>

  <!-- Mocha + Chai from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mocha@10/mocha.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chai@4/chai.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@js-temporal/polyfill@0.4.4/dist/index.umd.js"></script>

  <!-- <script src="./utils.js"></script> -->

  <!-- Utility functions (inlined from utils.js for file:// compatibility) -->
  <script>
    // @ts-check
    /* global temporal */
    const { Temporal } = temporal;
    const switchDebug = true;

    // --- utils.js (inlined) ---
    const Utils = (() => {

      /**
       * add two numbers.
       * @param {number} a - a number.
       * @param {number} b - another number
       * @return {number} result, two numbers added.
       */
      function add(a, b) {
        return a + b;
      }

      /**
       * subtract b from a.
       * @param {number} a - a number.
       * @param {number} b - number to subtract from a.
       * @return {number} result.
       */
      function subtract(a, b) {
        return a - b;
      }

      /**
       * capitalize.
       * @param {string} str - a string.
       * @return {string} capitalized word.
       */
      function capitalize(str) {
        if (typeof str !== 'string' || str.length === 0) return '';
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      /**
       * determine if a given number is even.
       * @param {number} n - a number.
       * @return {boolean} true if n is an even number.
       */
      function isEven(n) {
        return n % 2 === 0;
      }

      /**
       * returns a reversed version of given string.
       * @param {string} str - input string.
       * @return {string} str - reversed input.
       */
      function reverseString(str) {
        return str.split('').reverse().join('');
      }

      /**
       * Convert Excel serial date to a formatted date string (YYYY-MM-DD)
       * @param {number} serial - Excel date serial number
       * @param {boolean} [is1904=false] - Set true if using 1904 date system
       * @returns {string} - Date string in YYYY-MM-DD format
       */
      function convertExcelSerialToTemporalPlainDate(serial, is1904 = false) {

        if (switchDebug) {
          console.debug(serial);
          console.debug(is1904);
        }

        if (typeof serial !== 'number' || isNaN(serial)) {
          throw new Error("Invalid input: serial must be a number.");
        }

        // Excel's base date offset
        const excelEpoch = is1904 ? new Date(Date.UTC(1904, 0, 1)) : new Date(Date.UTC(1899, 11, 31));

        // Adjust for Excel's leap year bug (only for 1900 system and serial >= 60)
        let days = serial;
        if (!is1904 && serial >= 60) {
          if (switchDebug) console.debug('lets decrement days by 1.');
          days -= 1;
        }
        if (switchDebug) console.debug(days);

        // Convert days to milliseconds and add to base date
        // 1,000 msec x 60 sec x 60 min x 24 hours = 86400000
        const date = new Date(excelEpoch.getTime() + days * 86400000);

        // Format as YYYY-MM-DD
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, '0');
        const day = String(date.getUTCDate()).padStart(2, '0');

        console.debug(`${ Temporal.PlainDate.from(`${year}-${month}-${day}`) }`)

        return Temporal.PlainDate.from(`${year}-${month}-${day}`);
      }

      /**
       * Convert Temporal.PlainDate to Excel serial
       * @param {Temporal.PlainDate} plainDate - a Temporal.PlainDate value
       * @param {boolean} [is1904=false] - Set true if using 1904 date system
       * @returns {number} - an Excel serial date number
       */
      function convertTemporalPlainDateToExcelSerial(plainDate, is1904 = false) {
        if (!(plainDate instanceof Temporal.PlainDate)) {
          throw new TypeError("Expected a Temporal.PlainDate instance");
        }

        // Excel's base day 1 is 1900-01-01, but it incorrectly includes 1900-02-29
        const excelEpoch = is1904 ? Temporal.PlainDate.from("1904-12-31") : Temporal.PlainDate.from("1899-12-31");

        // Calculate days difference
        let days = plainDate.since(excelEpoch).total({ unit: "days" });

        // Adjust for Excel's leap year bug: add 1 for dates >= 1900-03-01
        const leapBugDate = Temporal.PlainDate.from("1900-03-01");
        if (!is1904 && Temporal.PlainDate.compare(plainDate, leapBugDate) == 1) {
          days += 1;
        }

        return days;
      }

      return { add, subtract, capitalize, isEven, reverseString, convertExcelSerialToTemporalPlainDate, convertTemporalPlainDateToExcelSerial };
    })();
  </script>

  <!-- Mocha setup & tests -->
  <script>
    /* global mocha chai */
    mocha.setup('bdd');
    mocha.checkLeaks();
    const { expect } = chai;
    // const { Temporal } = temporal;
    const { add, subtract, capitalize, isEven, reverseString, convertExcelSerialToTemporalPlainDate, convertTemporalPlainDateToExcelSerial } = Utils;

    describe('add()', function () {
      it('should return the sum of two numbers', function () {
        expect(add(2, 3)).to.equal(5);
      });
      it('should handle negative numbers', function () {
        expect(add(-1, -4)).to.equal(-5);
      });
    });

    describe('Utils.add()', function () {
      it('should return the sum of two numbers', function () {
        expect(Utils.add(2, 3)).to.equal(5);
      });
      it('should handle negative numbers', function () {
        expect(Utils.add(-1, -4)).to.equal(-5);
      });
    });

    describe('subtract()', function () {
      it('should return the difference of two numbers', function () {
        expect(subtract(10, 4)).to.equal(6);
      });
      it('should handle negative results', function () {
        expect(subtract(3, 7)).to.equal(-4);
      });
    });

    describe('capitalize()', function () {
      it('should capitalize the first letter', function () {
        expect(capitalize('hello')).to.equal('Hello');
      });
      it('should return empty string for empty input', function () {
        expect(capitalize('')).to.equal('');
      });
      it('should handle single character', function () {
        expect(capitalize('a')).to.equal('A');
      });
    });

    describe('isEven()', function () {
      it('should return true for even numbers', function () {
        expect(isEven(4)).to.be.true;
      });
      it('should return false for odd numbers', function () {
        expect(isEven(7)).to.be.false;
      });
      it('should return true for zero', function () {
        expect(isEven(0)).to.be.true;
      });
    });

    describe('reverseString()', function () {
      it('should reverse a string', function () {
        expect(reverseString('hello')).to.equal('olleh');
      });
      it('should handle palindromes', function () {
        expect(reverseString('racecar')).to.equal('racecar');
      });
      it('should handle single character', function () {
        expect(reverseString('x')).to.equal('x');
      });
    });

    describe('convertExcelSerialToTemopralPlainDate()', function () {
      it('should be an Excel serial', function () {
        expect(convertExcelSerialToTemporalPlainDate(46256)).to.equal(Temporal.PlainDate.from("2026-08-22"));
      });
      it('should be an Excel serial, trial 2', function () {
        expect(convertExcelSerialToTemporalPlainDate(46257)).to.equal(Temporal.PlainDate.from("2026-08-23"));
      });
    });

    describe('convertTemporalPlainDateToExcelSerial()', function () {
      it('should be a Temporal.PlainDate instance.', function () {
        expect(convertTemporalPlainDateToExcelSerial(Temporal.PlainDate.from("2026-08-22"))).to.equal(46256);
      });
      it('should be a Temporal.PlainDate instance, trial 2', function () {
        expect(convertTemporalPlainDateToExcelSerial(Temporal.PlainDate.from("2026-08-23"))).to.equal(46257);
      });
    });

    mocha.run();
  </script>
</body>
</html>
